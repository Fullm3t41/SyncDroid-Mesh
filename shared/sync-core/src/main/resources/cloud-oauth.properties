# Public desktop OAuth client IDs can be embedded for release builds.
SYNCDROID_GOOGLE_CLIENT_ID=
# Google issues Desktop app clients a secret and requires it on token requests. For installed
# apps Google does not treat it as confidential.
SYNCDROID_GOOGLE_CLIENT_SECRET=
SYNCDROID_MICROSOFT_CLIENT_ID=

# Android package/signing-certificate OAuth registration (public ID).
SYNCDROID_GOOGLE_ANDROID_CLIENT_ID=
