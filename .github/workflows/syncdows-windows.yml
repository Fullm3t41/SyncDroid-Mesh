name: SyncDows Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/windows/**"
      - "shared/**"
      - "protocol/fixtures/**"
      - ".github/workflows/syncdows-windows.yml"
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "shared/**"
      - "protocol/fixtures/**"
      - ".github/workflows/syncdows-windows.yml"

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Test and build branded EXE
        shell: pwsh
        run: .\build-windows.ps1

      - name: Verify fresh installation and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build\release\SyncDows-*-Windows-x64.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          .\installer\tests\Test-PackagedInstaller.ps1 -Installer $installers[0].FullName -DisposableMachine

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SyncDows-installer-logs
          path: |
            apps/windows/build/installer-smoke-logs/**
            apps/windows/build/installer/**/migration.log
            apps/windows/build/installer/**/overlap.log
          if-no-files-found: ignore

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: SyncDows-Windows
          path: apps/windows/build/release/*
          if-no-files-found: error
