name: Cross-platform release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle
      - name: Validate the release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          .\scripts\verify-release-version.ps1 -Version $tag.Substring(1)
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y
      - name: Test and package SyncDows
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          .\apps\windows\build-windows.ps1 -Version $tag.Substring(1)
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: apps/windows/build/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle
      - name: Validate the release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          ./scripts/verify-release-version.ps1 -Version $tag.Substring(1)
      - name: Test and package SyncTosh
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -m unittest discover -s apps/macos/installer/tests -v
          cd apps/macos
          ./gradlew --no-daemon clean test packageDmg
          dmg="$(find build/compose/binaries/main/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$dmg"
          mkdir -p build/release
          cp "$dmg" "build/release/SyncTosh-${version}-macOS-arm64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: apps/macos/build/release/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SYNCDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SYNCDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SYNCDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle
      - name: Validate the release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          ./scripts/verify-release-version.ps1 -Version $tag.Substring(1)
      - name: Restore the Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$SYNCDROID_KEYSTORE_PASSWORD"
          test -n "$SYNCDROID_KEY_ALIAS"
          test -n "$SYNCDROID_KEY_PASSWORD"
          key_store="$RUNNER_TEMP/syncdroid-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          echo "SYNCDROID_KEYSTORE_PATH=$key_store" >> "$GITHUB_ENV"
      - name: Test and package SyncDroid-Mesh
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd apps/android
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease
          mkdir -p build/release
          cp app/build/outputs/apk/release/app-release.apk "build/release/SyncDroid-Mesh-${version}-Android.apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner_path" verify --verbose "build/release/SyncDroid-Mesh-${version}-Android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: apps/android/build/release/*
          if-no-files-found: error

  publish:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    env:
      UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Build the update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          windows="SyncDows-${version}-Windows-x64.exe"
          macos="SyncTosh-${version}-macOS-arm64.dmg"
          android="SyncDroid-Mesh-${version}-Android.apk"
          for file in "$windows" "$macos" "$android"; do test -f "release-assets/$file"; done
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo "schema=1"
            echo "version=$version"
            echo "publishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "notesUrl=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            echo "asset.android.file=$android"
            echo "asset.android.url=$base/$android"
            echo "asset.android.sha256=$(sha256sum "release-assets/$android" | cut -d' ' -f1)"
            echo "asset.android.size=$(stat -c%s "release-assets/$android")"
            echo "asset.macos-arm64.file=$macos"
            echo "asset.macos-arm64.url=$base/$macos"
            echo "asset.macos-arm64.sha256=$(sha256sum "release-assets/$macos" | cut -d' ' -f1)"
            echo "asset.macos-arm64.size=$(stat -c%s "release-assets/$macos")"
            echo "asset.windows-x64.file=$windows"
            echo "asset.windows-x64.url=$base/$windows"
            echo "asset.windows-x64.sha256=$(sha256sum "release-assets/$windows" | cut -d' ' -f1)"
            echo "asset.windows-x64.size=$(stat -c%s "release-assets/$windows")"
          } > release-assets/syncdroid-update.properties
      - name: Sign the manifest and build the offline bundle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_BASE64"
          version="${GITHUB_REF_NAME#v}"
          private_key="$RUNNER_TEMP/syncdroid-update-signing.pem"
          signature_binary="$RUNNER_TEMP/syncdroid-update-signature.bin"
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$private_key"
          chmod 600 "$private_key"
          openssl dgst -sha256 -sign "$private_key" \
            -out "$signature_binary" release-assets/syncdroid-update.properties
          base64 -w 0 "$signature_binary" > release-assets/syncdroid-update.properties.sig
          (
            cd release-assets
            zip -q "SyncDroid-Mesh-${version}-offline.sdu" \
              syncdroid-update.properties \
              syncdroid-update.properties.sig \
              "SyncDroid-Mesh-${version}-Android.apk" \
              "SyncTosh-${version}-macOS-arm64.dmg" \
              "SyncDows-${version}-Windows-x64.exe"
          )
          rm -f "$private_key" "$signature_binary"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          public_assets=(
            "release-assets/SyncDroid-Mesh-${version}-Android.apk"
            "release-assets/SyncTosh-${version}-macOS-arm64.dmg"
            "release-assets/SyncDows-${version}-Windows-x64.exe"
            "release-assets/SyncDroid-Mesh-${version}-offline.sdu"
          )
          for file in "${public_assets[@]}"; do test -f "$file"; done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${public_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft=false \
              --latest \
              --title "SyncDroid-Mesh ${GITHUB_REF_NAME#v}"
          else
            gh release create "$GITHUB_REF_NAME" "${public_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "SyncDroid-Mesh ${GITHUB_REF_NAME#v}"
          fi
      - name: Publish signed updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          parent="$(gh api "$repo/git/ref/heads/updates" --jq .object.sha 2>/dev/null || true)"

          create_blob() {
            base64 -w 0 "$1" \
              | jq -Rs '{content: ., encoding: "base64"}' \
              | gh api --method POST "$repo/git/blobs" --input - --jq .sha
          }

          manifest_blob="$(create_blob release-assets/syncdroid-update.properties)"
          signature_blob="$(create_blob release-assets/syncdroid-update.properties.sig)"
          tree="$(
            jq -n \
              --arg manifest "$manifest_blob" \
              --arg signature "$signature_blob" \
              '{tree: [
                {path: "syncdroid-update.properties", mode: "100644", type: "blob", sha: $manifest},
                {path: "syncdroid-update.properties.sig", mode: "100644", type: "blob", sha: $signature}
              ]}' \
              | gh api --method POST "$repo/git/trees" --input - --jq .sha
          )"
          commit="$(
            if [[ -n "$parent" ]]; then
              jq -n --arg tree "$tree" --arg parent "$parent" --arg version "$GITHUB_REF_NAME" \
                '{message: ("Publish updater metadata for " + $version), tree: $tree, parents: [$parent]}'
            else
              jq -n --arg tree "$tree" --arg version "$GITHUB_REF_NAME" \
                '{message: ("Publish updater metadata for " + $version), tree: $tree, parents: []}'
            fi \
              | gh api --method POST "$repo/git/commits" --input - --jq .sha
          )"

          if [[ -n "$parent" ]]; then
            gh api --method PATCH "$repo/git/refs/heads/updates" -f sha="$commit" -F force=false >/dev/null
          else
            gh api --method POST "$repo/git/refs" -f ref="refs/heads/updates" -f sha="$commit" >/dev/null
          fi
